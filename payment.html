<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center font-sans p-4">

    <div class="max-w-md w-full bg-slate-800 border border-slate-700 p-8 rounded-2xl shadow-2xl text-center">
        <h1 class="text-2xl font-bold mb-2 text-indigo-400">Complete Payment</h1>
        <p class="text-slate-400 text-sm mb-6">Please transfer the required amount using the details below.</p>

        <div class="bg-slate-900 border border-slate-700 p-4 rounded-xl mb-6 text-left">
            <div class="mb-3">
                <span class="text-slate-400 text-xs block">Amount to Pay</span>
                <span id="display-amount" class="text-2xl font-bold text-emerald-400">₹0</span>
            </div>
            <div>
                <span class="text-slate-400 text-xs block">Target UPI ID</span>
                <div class="flex justify-between items-center mt-1">
                    <span id="display-upi" class="font-mono text-white bg-slate-800 px-2 py-1 rounded">Loading...</span>
                    <button onclick="copyUpi()" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg cursor-pointer">Copy UPI</button>
                </div>
            </div>
        </div>

        <div class="mb-6 text-left">
            <label class="block text-slate-400 text-sm mb-2">Enter Your UTR / Transaction ID</label>
            <input type="text" id="utr-input" placeholder="e.g., 403212345678" 
                class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500">
        </div>

        <button onclick="submitPayment()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition duration-300 cursor-pointer">
            Submit Payment Details
        </button>
    </div>

    <script>
        // Extract parameters from the URL string
        const urlParams = new URLSearchParams(window.location.search);
        const amount = urlParams.get('amt');
        const upi = urlParams.get('upi');

        if (amount) {
            document.getElementById('display-amount').innerText = `₹${amount}`;
        }
        if (upi) {
            document.getElementById('display-upi').innerText = decodeURIComponent(upi);
        }

        function copyUpi() {
            const upiText = document.getElementById('display-upi').innerText;
            navigator.clipboard.writeText(upiText);
            alert("UPI ID copied to clipboard!");
        }

        function submitPayment() {
            const utr = document.getElementById('utr-input').value;
            if (!utr) {
                alert("Please enter your UTR / Transaction ID");
                return;
            }
            alert("Payment details submitted successfully! Your transaction is pending verification.");
            document.getElementById('utr-input').value = '';
        }
    </script>
</body>
</html>
