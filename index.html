<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sampat Loan Repay - Generator</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f7f7f7; margin: 0; padding: 10px; }
    .container { max-width: 480px; width: 100%; margin: 20px auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .section-title { margin: 15px 0 10px; font-weight: bold; color: #444; font-size: 0.95em; }
    .utr-input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 1em; }
    .submit-btn { background: #0070f3; color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; cursor: pointer; font-size: 1em; margin-top: 10px; }
    #generatedLinkContainer { margin-top: 20px; display: none; word-break: break-all; background: #f1f1f1; padding: 10px; border-radius: 6px; }
  </style>
</head>
<body>

<div class="container" id="adminView">
  <h2>Payment Link Generator</h2>
  <div class="section-title">Amount (₹)</div>
  <input type="number" class="utr-input" id="inputAmount" placeholder="Enter amount">
  
  <div class="section-title">UPI ID</div>
  <input type="text" class="utr-input" id="inputUpi" placeholder="Enter UPI ID">
  
  <button class="submit-btn" onclick="generateLink()">Generate Link</button>
  <button class="submit-btn" style="background:#6c757d;" onclick="resetForm()">Reset</button>
  
  <div id="generatedLinkContainer">
    <strong>Generated Link:</strong><br>
    <a id="outputLink" href="#" target="_blank"></a>
  </div>
</div>

<script>
  function generateLink() {
    const amt = document.getElementById('inputAmount').value;
    const upi = document.getElementById('inputUpi').value;
    if (!amt || !upi) {
      alert('Please fill out both Amount and UPI ID.');
      return;
    }
    const currentUrl = window.location.href.split('?')[0];
    const targetUrl = currentUrl.substring(0, currentUrl.lastIndexOf('/') + 1) + 'payment.html';
    const generatedUrl = `${targetUrl}?amount=${encodeURIComponent(amt)}&upi=${encodeURIComponent(upi)}`;
    
    const outputLink = document.getElementById('outputLink');
    outputLink.href = generatedUrl;
    outputLink.textContent = generatedUrl;
    document.getElementById('generatedLinkContainer').style.display = 'block';
  }

  function resetForm() {
    document.getElementById('inputAmount').value = '';
    document.getElementById('inputUpi').value = '';
    document.getElementById('generatedLinkContainer').style.display = 'none';
  }
</script>

</body>
</html>
