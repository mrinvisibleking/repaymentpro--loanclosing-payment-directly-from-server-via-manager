<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center font-sans">

    <div id="landing-page" class="text-center p-8 bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 max-w-md w-full mx-4">
        <h1 class="text-3xl font-bold mb-6 text-indigo-400">Welcome</h1>
        <button onclick="openSecretModal()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-6 rounded-xl transition duration-300 shadow-lg cursor-pointer">
            Contact With Manager
        </button>
    </div>

    <div id="secret-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-8 max-w-md w-full shadow-2xl relative">
            <h2 class="text-2xl font-bold mb-4 text-indigo-400">Enter Secret Code</h2>
            <p class="text-slate-400 text-sm mb-6">Please enter the security code to proceed further.</p>
            
            <form onsubmit="verifySecretCode(event)">
                <input type="password" id="secret-code-input" placeholder="Enter secret code..." required
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white mb-4 focus:outline-none focus:border-indigo-500">
                <div id="secret-error" class="text-red-400 text-sm mb-4 hidden">Incorrect secret code. Try again.</div>
                
                <div class="flex space-x-3">
                    <button type="button" onclick="closeSecretModal()" class="w-1/2 bg-slate-700 hover:bg-slate-600 text-white py-3 rounded-xl transition duration-300 cursor-pointer">Cancel</button>
                    <button type="submit" class="w-1/2 bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-xl transition duration-300 cursor-pointer">Submit</button>
                </div>
            </form>
        </div>
    </div>

    <div id="admin-login-page" class="hidden text-center p-8 bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 max-w-md w-full mx-4">
        <h2 class="text-2xl font-bold mb-2 text-indigo-400">Admin Dashboard</h2>
        <p class="text-slate-400 text-sm mb-6">Enter your admin credentials to access `d3repayon.html`</p>
        
        <form onsubmit="verifyAdminLogin(event)" class="text-left">
            <div class="mb-4">
                <label class="block text-slate-400 text-sm mb-2">Admin Username</label>
                <input type="text" id="admin-user" required placeholder="Username"
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500">
            </div>
            
            <div class="mb-6">
                <label class="block text-slate-400 text-sm mb-2">Admin Password</label>
                <input type="password" id="admin-pass" required placeholder="Password"
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500">
            </div>

            <div id="admin-error" class="text-red-400 text-sm mb-4 hidden">Invalid username or password.</div>
            
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-6 rounded-xl transition duration-300 shadow-lg cursor-pointer">
                Login to Dashboard
            </button>
        </form>
    </div>

    <div id="d3repayon-container" class="hidden w-full min-h-screen">
        </div>

    <script>
        const CORRECT_SECRET_CODE = "hridoy21upiadmin";

        function openSecretModal() {
            document.getElementById('secret-modal').classList.remove('hidden');
            document.getElementById('secret-modal').classList.add('flex');
        }

        function closeSecretModal() {
            document.getElementById('secret-modal').classList.remove('flex');
            document.getElementById('secret-modal').classList.add('hidden');
            document.getElementById('secret-code-input').value = '';
            document.getElementById('secret-error').classList.add('hidden');
        }

        function verifySecretCode(event) {
            event.preventDefault();
            const enteredCode = document.getElementById('secret-code-input').value;
            const errorElement = document.getElementById('secret-error');

            if (enteredCode === CORRECT_SECRET_CODE) {
                // Close modal and switch from Landing Page to Admin Login Page
                closeSecretModal();
                document.getElementById('landing-page').classList.add('hidden');
                document.getElementById('admin-login-page').classList.remove('hidden');
            } else {
                errorElement.classList.remove('hidden');
            }
        }

        function verifyAdminLogin(event) {
            event.preventDefault();
            const user = document.getElementById('admin-user').value;
            const pass = document.getElementById('admin-pass').value;
            const errorElement = document.getElementById('admin-error');

            // You can configure your custom admin username and password check here
            // Example: username = "admin", password = "password123"
            if (user === "admin" && pass === "admin123") {
                // Hide admin login page and load d3repayon.html content
                document.getElementById('admin-login-page').classList.add('hidden');
                
                const dashboardContainer = document.getElementById('d3repayon-container');
                dashboardContainer.classList.remove('hidden');

                // Load d3repayon.html dynamically via fetch
                fetch('d3repayon.html')
                    .then(response => {
                        if (!response.ok) throw new Error("Page not found");
                        return response.text();
                    })
                    .then(html => {
                        dashboardContainer.innerHTML = html;
                    })
                    .catch(err => {
                        dashboardContainer.innerHTML = `
                            <div class="flex flex-col items-center justify-center min-h-screen p-4 text-center">
                                <h2 class="text-2xl font-bold text-red-400 mb-2">Error Loading Page</h2>
                                <p class="text-slate-400">Successfully logged in, but could not load <b>d3repayon.html</b>. Make sure the file exists in the same directory.</p>
                            </div>
                        `;
                    });
            } else {
                errorElement.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
