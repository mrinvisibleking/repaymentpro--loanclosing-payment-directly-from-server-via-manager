<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repayment Successful - RepayNow</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f2f5f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card-container {
      width: 100%;
      max-width: 900px; /* ডেসকটপে বড় হওয়ার জন্য width বাড়ানো হলো */
      margin: 0 auto;
    }

    /* Top Gradient Banner */
    .header-banner {
      background: linear-gradient(90deg, #fbf267 0%, #f7931e 100%);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 30px 20px 50px;
      text-align: center;
    }

    .user-name {
      font-size: clamp(20px, 2.5vw, 26px);
      font-weight: 600;
      color: #222222;
      margin-bottom: 6px;
    }

    .user-mobile {
      font-size: clamp(14px, 1.8vw, 17px);
      color: #444444;
    }

    /* Main Success Card */
    .success-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 35px 20px 30px;
      text-align: center;
      margin-top: -30px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
    }

    .icon-container {
      width: 56px;
      height: 56px;
      background-color: #e8f8f0;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 16px;
    }

    .check-icon {
      width: 30px;
      height: 30px;
      background-color: #10d078;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
    }

    .status-title {
      font-size: clamp(20px, 2.8vw, 28px);
      font-weight: 600;
      color: #2b2b2b;
      margin-bottom: 10px;
    }

    .status-subtext {
      font-size: clamp(13px, 1.8vw, 16px);
      color: #888888;
      line-height: 1.5;
    }

    /* Bottom Info Card */
    .info-card {
      background: #ffffff;
      border-radius: 20px;
      margin-top: 15px;
      padding: 24px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
    }

    .info-column {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .info-column.right {
      text-align: right;
    }

    .divider {
      width: 1px;
      height: 40px;
      background-color: #eef1f5;
      margin: 0 20px;
    }

    .label {
      font-size: clamp(13px, 1.8vw, 16px);
      color: #9ba3af;
    }

    .value {
      font-size: clamp(20px, 2.8vw, 28px);
      font-weight: 600;
      color: #f15a24;
    }

    /* Mobile View Responsive Adjustment */
    @media (max-width: 600px) {
      .card-container {
        max-width: 100%;
      }
      .info-card {
        padding: 18px 16px;
      }
      .divider {
        margin: 0 10px;
      }
    }
  </style>
</head>
<body>

  <div class="card-container">
    <!-- Top Header -->
    <div class="header-banner">
      <div class="user-name" id="userName">--</div>
      <div class="user-mobile">Mobile Number: <span id="userMobile">--</span></div>
    </div>

    <!-- Success Card -->
    <div class="success-card">
      <div class="icon-container">
        <div class="check-icon">✓</div>
      </div>
      <div class="status-title">Repayment Successful</div>
      <div class="status-subtext">
        Your loan has been fully settled.<br>
        Thank you for repaying on time!
      </div>
    </div>

    <!-- Payment Details -->
    <div class="info-card">
      <div class="info-column">
        <span class="label">Payable Amount</span>
        <span class="value" id="payableAmount">₹ --</span>
      </div>
      <div class="divider"></div>
      <div class="info-column right">
        <span class="label">Repayment Date</span>
        <span class="value" id="repaymentDate">--/--/----</span>
      </div>
    </div>
  </div>

  <script>
    // URL Params থেকে Data পড়া
    const urlParams = new URLSearchParams(window.location.search);
    const paramName = urlParams.get('name') || 'Ridhika Shen';
    const paramMobile = urlParams.get('mobile') || '9267839403';
    const paramAmount = urlParams.get('amount') || '3014';

    // UI তে কাস্টমারের তথ্য বসানো
    document.getElementById('userName').textContent = paramName;
    document.getElementById('userMobile').textContent = paramMobile;
    document.getElementById('payableAmount').textContent = '₹ ' + paramAmount;

    // আজকের তারিখ স্বয়ংক্রিয়ভাবে (DD/MM/YYYY) সেটিং
    const today = new Date();
    const day = String(today.getDate()).padStart(2, '0');
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const year = today.getFullYear();

    document.getElementById('repaymentDate').textContent = `${day}/${month}/${year}`;
  </script>

</body>
</html>
